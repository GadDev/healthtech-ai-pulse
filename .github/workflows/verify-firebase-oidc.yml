name: Verify Firebase OIDC
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    name: Verify ${{ matrix.environment }} identity
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: production
            project_variable: FIREBASE_PROJECT_ID
            provider_variable: FIREBASE_WIF_PROVIDER
            account_variable: FIREBASE_SERVICE_ACCOUNT
            expected_account: healthtech-prod-deployer@healthtech-ai-pulse.iam.gserviceaccount.com
          - environment: preview
            project_variable: PREVIEW_FIREBASE_PROJECT_ID
            provider_variable: PREVIEW_FIREBASE_WIF_PROVIDER
            account_variable: PREVIEW_FIREBASE_SERVICE_ACCOUNT
            expected_account: healthtech-preview-deployer@healthtech-ai-pulse.iam.gserviceaccount.com
    environment: ${{ matrix.environment }}
    permissions:
      contents: read
      id-token: write
    env:
      FIREBASE_PROJECT_ID: ${{ vars[matrix.project_variable] }}
      FIREBASE_SITE_URL: ${{ matrix.environment == 'production' && vars.FIREBASE_SITE_URL || format('https://{0}.web.app', vars.PREVIEW_FIREBASE_SITE_ID) }}
      FIREBASE_WIF_PROVIDER: ${{ vars[matrix.provider_variable] }}
      FIREBASE_SERVICE_ACCOUNT: ${{ vars[matrix.account_variable] }}
      EXPECTED_SERVICE_ACCOUNT: ${{ matrix.expected_account }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          package-manager-cache: false
      - name: Validate target and environment configuration
        shell: bash
        run: |
          set -euo pipefail
          node scripts/validate-deployment.mjs
          test "$FIREBASE_SERVICE_ACCOUNT" = "$EXPECTED_SERVICE_ACCOUNT"
          test "$FIREBASE_WIF_PROVIDER" = "projects/293427463899/locations/global/workloadIdentityPools/github/providers/github"
      - name: Exchange GitHub OIDC for a short-lived read-only token
        id: auth
        uses: google-github-actions/auth@v3
        with:
          project_id: ${{ env.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ env.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ env.FIREBASE_SERVICE_ACCOUNT }}
          token_format: access_token
          access_token_lifetime: 300s
          access_token_scopes: https://www.googleapis.com/auth/firebase.hosting.readonly
          create_credentials_file: false
          export_environment_variables: false
      - name: Verify authenticated Hosting read
        env:
          GOOGLE_ACCESS_TOKEN: ${{ steps.auth.outputs.access_token }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$GOOGLE_ACCESS_TOKEN"
          curl --fail --silent --show-error --max-time 30 --retry 3 \
            --header "Authorization: Bearer $GOOGLE_ACCESS_TOKEN" \
            "https://firebasehosting.googleapis.com/v1beta1/projects/$FIREBASE_PROJECT_ID/sites/$FIREBASE_PROJECT_ID" \
            --output "$RUNNER_TEMP/hosting-site.json"
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const site = JSON.parse(readFileSync(`${process.env.RUNNER_TEMP}/hosting-site.json`, 'utf8'));
          const expectedNames = new Set([
            'projects/healthtech-ai-pulse/sites/healthtech-ai-pulse',
            'projects/293427463899/sites/healthtech-ai-pulse',
          ]);
          if (!expectedNames.has(site.name) || new URL(site.defaultUrl).href !== new URL(process.env.FIREBASE_SITE_URL).href) {
            throw new Error('Hosting API returned an unexpected target site.');
          }
          console.log('OIDC exchange and authenticated target Hosting read passed.');
          NODE
      - name: Record verification boundary
        env:
          VERIFIED_ENVIRONMENT: ${{ matrix.environment }}
        shell: bash
        run: |
          printf '%s\n' \
            "## Firebase OIDC: $VERIFIED_ENVIRONMENT" \
            "- Service account: $FIREBASE_SERVICE_ACCOUNT" \
            '- Short-lived token and authenticated target Hosting read: passed.' \
            '- No site or channel was created, updated, deleted or deployed.' \
            '- Hosting write, smoke and rollback checks remain separate.' \
            >> "$GITHUB_STEP_SUMMARY"
