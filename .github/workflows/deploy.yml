name: Deploy HealthTech AI Pulse
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
  id-token: write
concurrency:
  group: healthtech-hosting-production
  cancel-in-progress: false
jobs:
  deploy:
    # Remains inactive until dedicated target infrastructure is verified.
    if: github.ref == 'refs/heads/main' && vars.HEALTHTECH_DEPLOY_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: production
    env:
      FIREBASE_PROJECT_ID: ${{ vars.FIREBASE_PROJECT_ID }}
      FIREBASE_SITE_URL: ${{ vars.FIREBASE_SITE_URL }}
      SITE_URL: ${{ vars.FIREBASE_SITE_URL }}
      FIREBASE_WIF_PROVIDER: ${{ vars.FIREBASE_WIF_PROVIDER }}
      FIREBASE_SERVICE_ACCOUNT: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22.22.3
          cache: npm
      - run: npm ci
      - name: Check isolated target configuration
        run: npm run deploy:check
      - run: npm run verify
      - name: Browser publication gate
        run: |
          npx playwright install --with-deps chromium
          npm run test:e2e
      - name: Check static artifacts
        run: |
          test -f dist/index.html
          test -f dist/rss.xml
          test -f dist/robots.txt
          test -f dist/sitemap-index.xml
          test -f dist/pagefind/pagefind.js
      - name: Skip superseded production runs
        id: current
        shell: bash
        run: |
          latest="$(git ls-remote origin refs/heads/main | cut -f1)"
          if test "$latest" = "$GITHUB_SHA"; then
            echo "eligible=true" >> "$GITHUB_OUTPUT"
          else
            echo "eligible=false" >> "$GITHUB_OUTPUT"
            echo "::notice::This revision was superseded on main; production deployment skipped."
          fi
      - uses: google-github-actions/auth@v3
        if: steps.current.outputs.eligible == 'true'
        with:
          project_id: ${{ vars.FIREBASE_PROJECT_ID }}
          workload_identity_provider: ${{ vars.FIREBASE_WIF_PROVIDER }}
          service_account: ${{ vars.FIREBASE_SERVICE_ACCOUNT }}
          create_credentials_file: true
      - name: Deploy target Hosting site
        if: steps.current.outputs.eligible == 'true'
        run: npx --yes firebase-tools@15.30.2 deploy --only hosting --project "$FIREBASE_PROJECT_ID" --non-interactive
      - name: Smoke check production
        if: steps.current.outputs.eligible == 'true'
        run: |
          for path in / /rss.xml /robots.txt /sitemap-index.xml; do
            curl --fail --silent --show-error --location --retry 3 "$FIREBASE_SITE_URL$path" -o /dev/null
          done
