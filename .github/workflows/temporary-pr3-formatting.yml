name: Temporary PR3 Formatting
on:
  push:
    branches: [feat/research-verified-paper-links]
permissions:
  contents: read
jobs:
  format-paper-links:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Format only PR 3 changes and emit transfer bytes
        shell: bash
        run: |
          set -euo pipefail
          npx oxfmt --write src/lib/research/verified-paper-links.ts 'src/pages/stories/[...id].astro' tests/verified-paper-links.test.ts tests/e2e/research-deep-links.spec.ts docs/research/engineering/VERIFIED_STORY_LINKS_V1.md
          for path in src/lib/research/verified-paper-links.ts 'src/pages/stories/[...id].astro' tests/verified-paper-links.test.ts tests/e2e/research-deep-links.spec.ts docs/research/engineering/VERIFIED_STORY_LINKS_V1.md; do
            data="$(base64 -w0 "$path")"
            printf 'PR3_FILE_BEGIN::%s::%s::PR3_FILE_END\n' "$path" "$data"
          done
