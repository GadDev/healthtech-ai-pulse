name: Temporary Research PR2 Preparation
on:
  push:
    branches: [feat/research-fixture-island]
permissions:
  contents: read
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Resolve lockfile and install packages without scripts
        run: |
          npm install --package-lock-only --ignore-scripts --no-audit --no-fund
          npm ci --no-audit --no-fund
      - name: Apply pinned repository formatter
        run: |
          npx oxfmt --write astro.config.mjs package.json tsconfig.json src/layouts/BaseLayout.astro src/lib/research src/components/research src/pages/research src/styles/research.css tests/research-link.test.ts tests/e2e/research.spec.ts
      - name: Emit exact formatted file bytes
        shell: bash
        run: |
          set -euo pipefail
          for path in package-lock.json astro.config.mjs package.json tsconfig.json src/layouts/BaseLayout.astro src/lib/research/parse-public-id.ts src/lib/research/fixtures.ts src/components/research/ResearchExplorer.tsx src/pages/research/index.astro src/styles/research.css tests/research-link.test.ts tests/e2e/research.spec.ts; do
            data="$(base64 -w0 "$path")"
            printf 'PR2_FILE_BEGIN::%s::%s::PR2_FILE_END\n' "$path" "$data"
          done
