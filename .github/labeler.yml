      - any-glob-to-any-file:
          - '.github/**'
          - 'infra/**'
          - 'scripts/**'
          - 'firebase*.json'
          - 'astro.config.mjs'
          - 'package.json'
          - 'package-lock.json'
          - 'tsconfig.json'
          - 'playwright.config.ts'
design:
