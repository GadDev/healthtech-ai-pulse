name: Editorial correction
description: Report a factual, sourcing, attribution, or clarity problem in a published story
title: 'content: correction for '
labels: ['content']
body:
  - type: markdown
    attributes:
      value: |
        Include public sources only. Do not submit patient data, private records,
        credentials or confidential material. This form is not a medical advice service.
  - type: input
    id: article
    attributes:
      label: Article or edition
      description: Paste the Pulse URL or repository path.
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What should be corrected?
      description: Quote or identify the specific claim, source, attribution, date, or wording that needs review.
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: Supporting evidence
      description: Link the primary source or strongest available evidence supporting the correction.
    validations:
      required: true
  - type: textarea
    id: proposed
    attributes:
      label: Suggested correction
      description: Optional wording or a concise description of the desired change.
